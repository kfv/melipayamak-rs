[package]
name = "melipayamak"
version = "0.2.0"
authors = ["Faraz Vahedi <kfv@FreeBSD.org>"]
edition = "2024"
rust-version = "1.97"
description = "Unofficial client for the Melipayamak (melipayamak.com) SMS REST API"
license = "BSD-2-Clause"
repository = "https://github.com/kfv/melipayamak-rs"
readme = "README.md"
keywords = ["melipayamak", "sms", "otp", "iran"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src", "/CHANGELOG.md", "/LICENSE", "/README.md"]

[features]
default = ["rustls"]
# The HTTP client.  Without it the crate is the types and `wire`.
client = ["dep:reqwest"]
rustls = ["client", "reqwest/rustls"]
native-tls = ["client", "reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "system-proxy"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt"] }

[[test]]
name = "client"
required-features = ["client"]
